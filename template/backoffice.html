<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Backoffice — Bicentenaires de photographie</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
        <link rel="stylesheet" href="../style/backoffice.css">
        <script src="../script/backoffice.js"></script>
    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <a href="../index.html" class="navbar-brand">
                    <i class="ph ph-map-pin-area"></i>
                    Bicentenaires de photographie
                </a>
                <a href="../index.html" class="btn btn-outline-light">
                    <i class="ph ph-map-trifold"></i>
                    Retour à la carte
                </a>
            </div>
        </nav>

        <main class="container-fluid py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h1>Backoffice</h1>
                    <p class="text-muted mb-0">
                        Gestion des photographies historiques
                    </p>
                </div>
                
                <!-- Import - Export -->
                <div class="d-flex gap-2">
                    <label class="btn btn-outline-primary mb-0">
                        <i class="ph ph-upload-simple"></i>
                        Importer un JSON
                        <input type="file" id="json-import" accept=".json,application/json" hidden>
                    </label>

                    <button class="btn btn-success" id="export-json">
                        <i class="ph ph-download-simple"></i>
                        Exporter le JSON
                    </button>
                </div>
            </div>

            <div id="alert-container"></div>
            <div class="row g-4">

                <!-- Formulaire -->
                <div class="col-xl-5">
                    <div class="card shadow-sm">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="ph ph-image"></i>Ajouter une photographie</h5>
                        </div>
                        <div class="card-body">
                            <form id="image-form">
                                <div class="mb-3">
                                    <!-- Images -->
                                    <label class="form-label">Photographie *</label>
                                    <input type="file" class="form-control" id="image-file" accept="image/*" required>
                                    <div id="image-preview-container" class="mt-3 d-none">
                                        <img id="image-preview" class="image-preview" alt="Prévisualisation">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <!-- Date -->
                                        <label class="form-label">Date *</label>
                                        <input type="number" class="form-control" id="image-date" placeholder="1899" min="1826" max="2027" required>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <!-- Type -->
                                        <label class="form-label">Type</label>

                                        <select class="form-select" id="image-type">
                                            <option value="jpg">JPG</option>
                                            <option value="jpeg">JPEG</option>
                                            <option value="png">PNG</option>
                                            <option value="webp">WEBP</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <!-- Nom Dossier -->
                                    <label class="form-label">Dossier *</label>
                                    <input type="text" class="form-control" id="image-folder" placeholder="gare albi madeleine" required>
                                    <div class="form-text">Nom du dossier qui contiendra la photo.</div>
                                </div>

                                <div class="mb-3">
                                    <!-- Description -->
                                    <label class="form-label">Description</label>
                                    <textarea class="form-control" id="image-description" rows="4" placeholder="Description de la photographie..."></textarea>
                                </div>
                                <div class="mb-4">
                                    <!-- Marqueurs -->
                                    <label class="form-label">Marqueurs associés *</label>
                                    <div id="markers-list" class="markers-selector"></div>
                                    <div class="form-text">Une photographie peut être associée à plusieurs marqueurs.</div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary flex-grow-1">
                                        <i class="ph ph-plus"></i>
                                        Ajouter la photographie
                                    </button>
                                    <button type="reset" class="btn btn-outline-secondary" id="reset-form">
                                        Réinitialiser
                                    </button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>

                <!-- LISTE -->
                <div class="col-xl-7">
                    <div class="card shadow-sm">
                        <div class="card-header d-flex justify-content-between">
                            <h5 class="mb-0"><i class="ph ph-images"></i>Photographies</h5>
                            <span id="image-count" class="badge bg-primary">0</span>
                        </div>
                        <div class="card-body p-0">
                            <div id="images-list" class="images-list"></div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </body>
</html>
